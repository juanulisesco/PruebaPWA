<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90d9">
    <!-- Meta tags requeridos por iOS para reconocer la PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Push PWA">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>Push PWA</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Push PWA</h1>
        <p id="status">Cargando...</p>

        <div id="install-section" style="display:none;" class="section">
            <button id="install-btn">📲 Agregar a pantalla de inicio</button>
            <p id="install-ios" style="display:none;" class="install-ios-msg">
                Tocá <strong>Compartir</strong> (⎙) y luego <strong>"Agregar a pantalla de inicio"</strong>.
            </p>
        </div>

        <div id="activate-section" class="section">
            <button id="activate-btn" disabled>Activar notificaciones</button>
        </div>

        <div class="section">
            <label for="subscribe-group">Unirme al grupo:</label>
            <select id="subscribe-group" disabled>
                <option value="rojo">🔴 Grupo Rojo</option>
                <option value="azul">🔵 Grupo Azul</option>
                <option value="verde">🟢 Grupo Verde</option>
            </select>
            <button id="join-group-btn" disabled>Unirme al grupo</button>
        </div>

        <div class="section">
            <label for="sender-name">Tu nombre:</label>
            <input type="text" id="sender-name" placeholder="Ej: Juan" maxlength="50" disabled>
        </div>

        <div class="section">
            <button id="notify-btn" disabled>Enviar notificación al grupo</button>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
