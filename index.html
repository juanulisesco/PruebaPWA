<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90d9">
    <!-- Meta tags requeridos por iOS para reconocer la PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Push PWA">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>Push PWA</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Push PWA</h1>
        <p id="status">Cargando...</p>
        <button id="subscribe-btn" disabled>Activar notificaciones</button>
        <button id="notify-btn" disabled>Enviar notificación</button>
    </div>
    <script src="/app.js"></script>
</body>
</html>
